<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoya — PrvnNotes</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #07111f;
    color: #e9eef5;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar {
    height: 64px;
    background: #081321;
    border-bottom: 1px solid #1d2a3b;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 8%;

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
}

.nav-links a {
    color: #c7d0dc;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover {
    color: white;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    min-height: calc(100vh - 64px);
    padding: 55px 20px 80px;
}


/* =========================================================
   ZOYA CONTAINER
========================================================= */

.zoya-container {
    width: min(850px, 100%);
    margin: auto;

    background: #0c1726;

    border: 1px solid #263547;

    border-radius: 5px;

    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,.18);
}


/* =========================================================
   HEADER
========================================================= */

.zoya-header {

    padding: 30px;

    border-bottom: 1px solid #263547;

    display: flex;

    align-items: center;

    gap: 20px;
}


/* =========================================================
   ZOYA AVATAR
========================================================= */

.zoya-avatar {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #e8edf5,
            #aeb9c8
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 35px;

    box-shadow:
        0 0 0 5px #111e2f,
        0 0 25px rgba(255,255,255,.08);
}


/* =========================================================
   TITLE
========================================================= */

.zoya-title h1 {

    margin: 0 0 6px;

    font-size: 25px;

}

.zoya-title p {

    margin: 0;

    color: #8e9bad;

    font-size: 14px;

}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-area {

    height: 510px;

    overflow-y: auto;

    padding: 28px;

}


/* scrollbar */

.chat-area::-webkit-scrollbar {
    width: 7px;
}

.chat-area::-webkit-scrollbar-track {
    background: #0a1421;
}

.chat-area::-webkit-scrollbar-thumb {
    background: #354355;
    border-radius: 10px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    display: flex;

    margin-bottom: 22px;

    animation:
        messageAppear .35s ease;

}

.message.zoya {

    justify-content: flex-start;

}

.message.user {

    justify-content: flex-end;

}


@keyframes messageAppear {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   BUBBLE
========================================================= */

.bubble {

    max-width: 72%;

    padding: 16px;

    border:
        1px solid #2a394c;

    background:
        #101d2d;

    line-height: 1.65;

    font-size: 15px;

    white-space: pre-wrap;

}


.user .bubble {

    background:
        #202c3d;

}


.label {

    display: block;

    font-size: 10px;

    letter-spacing: 1px;

    color: #7e8b9c;

    margin-bottom: 7px;

    text-transform: uppercase;

}


/* =========================================================
   THINKING
========================================================= */

.thinking-bubble {

    display: flex;

    align-items: center;

    gap: 14px;

}


/* =========================================================
   THINKING CHARACTER
========================================================= */

.thinking-character {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #e8edf5,
            #b4bfcd
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 26px;

    animation:
        thinkingFloat 1.6s ease-in-out infinite;

}


@keyframes thinkingFloat {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px)
            rotate(-2deg);
    }

    100% {
        transform:
            translateY(0);
    }

}


/* =========================================================
   THINKING DOTS
========================================================= */

.thinking-text {

    color: #aeb8c5;

}


.dots {

    display: inline-flex;

    margin-left: 3px;

}


.dots span {

    animation:
        dotAnimation 1.3s infinite;

}


.dots span:nth-child(2) {

    animation-delay:
        .18s;

}


.dots span:nth-child(3) {

    animation-delay:
        .36s;

}


@keyframes dotAnimation {

    0%,20% {

        opacity: .2;

        transform:
            translateY(0);

    }

    50% {

        opacity: 1;

        transform:
            translateY(-3px);

    }

    100% {

        opacity: .2;

        transform:
            translateY(0);

    }

}


/* =========================================================
   QUICK BUTTONS
========================================================= */

.quick-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    padding:
        0 28px 20px;

}


.quick-buttons button {

    background:
        transparent;

    border:
        1px solid #263547;

    color:
        #aeb9c6;

    padding:
        9px 13px;

    font-size:
        12px;

    cursor:
        pointer;

    transition:
        .2s;

}


.quick-buttons button:hover {

    background:
        #172538;

    color:
        white;

}


/* =========================================================
   VOICE CONTROLS
========================================================= */

.voice-controls {

    display: flex;

    justify-content:
        flex-end;

    align-items:
        center;

    gap: 8px;

    padding:
        0 16px 12px;

}


.voice-button {

    border:
        1px solid #2d3c4e;

    background:
        transparent;

    color:
        #9eabb9;

    padding:
        7px 11px;

    font-size:
        11px;

    cursor:
        pointer;

    transition:
        .2s;

}


.voice-button:hover {

    background:
        #162436;

    color:
        white;

}


/* =========================================================
   MICROPHONE BUTTON
========================================================= */

.mic-button {

    width: 50px;

    height: 50px;

    border:
        1px solid #3a485a;

    background:
        #182538;

    color:
        white;

    cursor:
        pointer;

    font-size:
        20px;

    transition:
        .2s;

    flex-shrink: 0;

}


.mic-button:hover {

    background:
        #26364b;

}


.mic-button.listening {

    background:
        #6b2530;

    border-color:
        #a64251;

    animation:
        micPulse 1.2s infinite;

}


@keyframes micPulse {

    0% {

        box-shadow:
            0 0 0 0 rgba(200,60,80,.45);

    }

    70% {

        box-shadow:
            0 0 0 12px rgba(200,60,80,0);

    }

    100% {

        box-shadow:
            0 0 0 0 rgba(200,60,80,0);

    }

}


/* =========================================================
   INPUT
========================================================= */

.input-area {

    padding:
        16px;

    border-top:
        1px solid #263547;

    display:
        flex;

    gap:
        10px;

}


#zoyaInput {

    flex:
        1;

    min-width:
        0;

    background:
        #101c2c;

    border:
        1px solid #3a485a;

    color:
        white;

    padding:
        15px;

    outline:
        none;

    font-size:
        14px;

}


#zoyaInput:focus {

    border-color:
        #66758a;

}


#zoyaInput::placeholder {

    color:
        #718096;

}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendButton {

    width:
        55px;

    border:
        1px solid #3a485a;

    background:
        #182538;

    color:
        white;

    cursor:
        pointer;

    font-size:
        20px;

    transition:
        .2s;

    flex-shrink:
        0;

}


#sendButton:hover {

    background:
        #26364b;

}


#sendButton:disabled {

    opacity:
        .4;

    cursor:
        not-allowed;

}


/* =========================================================
   VOICE STATUS
========================================================= */

.voice-status {

    font-size:
        11px;

    color:
        #758497;

    padding:
        0 16px 12px;

    min-height:
        18px;

    text-align:
        right;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    border-top:
        1px solid #172638;

    padding:
        35px 8%;

    color:
        #8fa0b3;

    font-size:
        13px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .navbar {

        padding:
            0 20px;

    }

    .nav-links {

        gap:
            12px;

    }

    .nav-links a {

        font-size:
            11px;

    }

    .page {

        padding:
            20px 10px 50px;

    }

    .zoya-header {

        padding:
            22px;

    }

    .chat-area {

        height:
            500px;

        padding:
            18px;

    }

    .bubble {

        max-width:
            86%;

    }

    .quick-buttons {

        padding:
            0 18px 15px;

    }

    .input-area {

        padding:
            10px;

    }

    #zoyaInput {

        padding:
            13px;

    }

    #sendButton,
    .mic-button {

        width:
            46px;

        height:
            46px;

    }

}

</style>

</head>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const chatArea =
    document.getElementById(
        "chatArea"
    );


const zoyaInput =
    document.getElementById(
        "zoyaInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const micButton =
    document.getElementById(
        "micButton"
    );


const voiceStatus =
    document.getElementById(
        "voiceStatus"
    );


const zoyaAvatar =
    document.getElementById(
        "zoyaAvatar"
    );


/* =========================================================
   CONVERSATION
========================================================= */

let conversationHistory = [];


/* =========================================================
   VOICE
========================================================= */

let availableVoices = [];


/* =========================================================
   LOAD BROWSER VOICES
========================================================= */

function loadVoices() {

    if (
        "speechSynthesis"
        in window
    ) {

        availableVoices =
            window
                .speechSynthesis
                .getVoices();

    }

}


loadVoices();


if (
    "speechSynthesis"
    in window &&
    "onvoiceschanged"
    in speechSynthesis
) {

    speechSynthesis.onvoiceschanged =
        loadVoices;

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    role,
    text
) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + role;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const label =
        document.createElement(
            "span"
        );


    label.className =
        "label";


    label.textContent =
        role === "zoya"
            ? "Zoya"
            : "You";


    const content =
        document.createElement(
            "div"
        );


    content.textContent =
        text;


    bubble.appendChild(
        label
    );


    bubble.appendChild(
        content
    );


    message.appendChild(
        bubble
    );


    chatArea.appendChild(
        message
    );


    scrollChat();

}


/* =========================================================
   SCROLL
========================================================= */

function scrollChat() {

    chatArea.scrollTop =
        chatArea.scrollHeight;

}


/* =========================================================
   THINKING
========================================================= */

function showThinking() {


    removeThinking();


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message zoya";


    thinking.id =
        "thinkingMessage";


    thinking.innerHTML = `

        <div class="bubble thinking-bubble">

            <div class="thinking-character">
                👩🏻
            </div>

            <div class="thinking-text">

                Zoya is thinking

                <span class="dots">

                    <span>.</span>
                    <span>.</span>
                    <span>.</span>

                </span>

            </div>

        </div>

    `;


    chatArea.appendChild(
        thinking
    );


    scrollChat();

}


/* =========================================================
   REMOVE THINKING
========================================================= */

function removeThinking() {


    const thinking =
        document.getElementById(
            "thinkingMessage"
        );


    if (thinking) {

        thinking.remove();

    }

}


/* =========================================================
   ZOYA TALKING ANIMATION
========================================================= */

function startTalkingAnimation() {

    zoyaAvatar.textContent =
        "👩🏻";

    zoyaAvatar.style.transform =
        "scale(1.05)";

}


function stopTalkingAnimation() {

    zoyaAvatar.style.transform =
        "scale(1)";

}


/* =========================================================
   FIND INDIAN FEMALE VOICE
========================================================= */

function findIndianVoice() {


    if (!availableVoices.length) {

        loadVoices();

    }


    /*
       First preference:
       Indian English voices
    */

    let voice =
        availableVoices.find(
            function(v) {

                return (
                    v.lang &&
                    v.lang
                        .toLowerCase()
                        === "en-in"
                );

            }
        );


    /*
       Second preference:
       Any Indian voice
    */

    if (!voice) {

        voice =
            availableVoices.find(
                function(v) {

                    return (
                        v.lang &&
                        v.lang
                            .toLowerCase()
                            .includes(
                                "en-in"
                            )
                    );

                }
            );

    }


    /*
       Third preference:
       A female-sounding English voice
       where the browser exposes a useful name.
    */

    if (!voice) {

        voice =
            availableVoices.find(
                function(v) {

                    const name =
                        (
                            v.name || ""
                        ).toLowerCase();


                    return (
                        v.lang &&
                        v.lang
                            .toLowerCase()
                            .startsWith(
                                "en"
                            ) &&
                        (
                            name.includes(
                                "female"
                            ) ||
                            name.includes(
                                "woman"
                            ) ||
                            name.includes(
                                "samantha"
                            ) ||
                            name.includes(
                                "zira"
                            )
                        )
                    );

                }
            );

    }


    /*
       Final fallback:
       Any English voice.
    */

    if (!voice) {

        voice =
            availableVoices.find(
                function(v) {

                    return (
                        v.lang &&
                        v.lang
                            .toLowerCase()
                            .startsWith(
                                "en"
                            )
                    );

                }
            );

    }


    return voice;

}


/* =========================================================
   SPEAK ZOYA
========================================================= */

function speakZoya(text) {


    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        voiceStatus.textContent =
            "Your browser does not support voice.";

        return;

    }


    speechSynthesis.cancel();


    const cleanText =
        String(text)
            .replace(
                /[*#_`]/g,
                ""
            )
            .replace(
                /\n+/g,
                ". "
            )
            .trim();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    const voice =
        findIndianVoice();


    if (voice) {

        utterance.voice =
            voice;

        utterance.lang =
            voice.lang;

    } else {

        utterance.lang =
            "en-IN";

    }


    /*
       Natural female conversational settings
    */

    utterance.rate =
        0.94;


    utterance.pitch =
        1.08;


    utterance.volume =
        1;


    utterance.onstart =
        function() {

            voiceStatus.textContent =
                "🔊 Zoya is speaking...";

            startTalkingAnimation();

        };


    utterance.onend =
        function() {

            voiceStatus.textContent =
                "";

            stopTalkingAnimation();

        };


    utterance.onerror =
        function() {

            voiceStatus.textContent =
                "";

            stopTalkingAnimation();

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   STOP SPEAKING
========================================================= */

function stopSpeaking() {


    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();

    }


    stopTalkingAnimation();


    voiceStatus.textContent =
        "";

}


/* =========================================================
   TEST VOICE
========================================================= */

function testVoice() {


    stopSpeaking();


    speakZoya(
        "Hi! I'm Zoya. This is how my voice sounds. Now you can talk to me or type to me."
    );

}


/* =========================================================
   MICROPHONE / SPEECH RECOGNITION
========================================================= */

let recognition =
    null;


let isListening =
    false;


/*
   Chrome uses SpeechRecognition.
   Some browsers expose webkitSpeechRecognition.
*/

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================================================
   SETUP RECOGNITION
========================================================= */

if (SpeechRecognition) {


    recognition =
        new SpeechRecognition();


    /*
       Indian English

       This tells the browser that
       the speaker is likely using
       Indian English.

       Users can still speak naturally.
    */

    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening =
                true;


            micButton.classList.add(
                "listening"
            );


            micButton.textContent =
                "⏹";


            voiceStatus.textContent =
                "🎙️ I'm listening...";

        };


    recognition.onresult =
        function(event) {


            let transcript =
                "";


            for (
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ) {


                transcript +=
                    event
                        .results[i][0]
                        .transcript;


            }


            zoyaInput.value =
                transcript;


            /*
               If this is the final result,
               automatically send it.
            */

            const lastResult =
                event.results[
                    event.results.length - 1
                ];


            if (
                lastResult &&
                lastResult.isFinal
            ) {

                setTimeout(
                    function() {

                        if (
                            zoyaInput.value.trim()
                        ) {

                            sendMessage();

                        }

                    },
                    250
                );

            }

        };


    recognition.onerror =
        function(event) {


            console.log(
                "Speech recognition error:",
                event.error
            );


            isListening =
                false;


            micButton.classList.remove(
                "listening"
            );


            micButton.textContent =
                "🎙️";


            if (
                event.error ===
                "not-allowed"
            ) {

                voiceStatus.textContent =
                    "Microphone permission was blocked.";

            }
            else {

                voiceStatus.textContent =
                    "I couldn't hear that. Try again.";

            }

        };


    recognition.onend =
        function() {


            isListening =
                false;


            micButton.classList.remove(
                "listening"
            );


            micButton.textContent =
                "🎙️";


            /*
               Don't erase the text.
            */

            setTimeout(
                function() {

                    if (
                        !speechSynthesis.speaking
                    ) {

                        voiceStatus.textContent =
                            "";

                    }

                },
                700
            );

        };

}


/* =========================================================
   TOGGLE MICROPHONE
========================================================= */

function toggleListening() {


    /*
       Browser doesn't support it
    */

    if (!recognition) {

        voiceStatus.textContent =
            "Voice input isn't supported in this browser. Try Chrome.";

        return;

    }


    /*
       Stop listening
    */

    if (isListening) {

        recognition.stop();

        return;

    }


    /*
       Stop Zoya speaking
    */

    stopSpeaking();


    /*
       Clear old text
    */

    zoyaInput.value =
        "";


    try {

        recognition.start();

    }
    catch(error) {

        console.log(
            error
        );

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {


    const question =
        zoyaInput.value.trim();


    if (!question) {

        return;

    }


    /*
       Stop microphone
    */

    if (
        recognition &&
        isListening
    ) {

        recognition.stop();

    }


    /*
       Stop previous voice
    */

    stopSpeaking();


    /*
       Display user's message
    */

    addMessage(
        "user",
        question
    );


    /*
       Clear input
    */

    zoyaInput.value =
        "";


    /*
       Disable controls
    */

    zoyaInput.disabled =
        true;


    sendButton.disabled =
        true;


    micButton.disabled =
        true;


    /*
       Show thinking character
    */

    showThinking();


    try {


        /*
           Save user message
        */

        conversationHistory.push({

            role:
                "user",

            content:
                question

        });


        /*
           Call your existing Vercel API
        */

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                question,

                            history:
                                conversationHistory

                        })

                }
            );


        /*
           Read API response
        */

        const data =
            await response.json();


        /*
           Remove thinking animation
        */

        removeThinking();


        /*
           Error
        */

        if (!response.ok) {

            throw new Error(

                data?.error ||
                "Zoya couldn't answer right now."

            );

        }


        /*
           Your current chat.js returns
           { answer: "..." }

           So we use answer first.
        */

        const answer =
            data.answer ||
            data.reply ||
            data.response ||
            data.message ||
            data.text ||
            data.output;


        if (!answer) {

            throw new Error(
                "Zoya returned an empty answer."
            );

        }


        /*
           Save Zoya response
        */

        conversationHistory.push({

            role:
                "assistant",

            content:
                answer

        });


        /*
           Keep history manageable
        */

        if (
            conversationHistory.length >
            20
        ) {

            conversationHistory =
                conversationHistory.slice(
                    -20
                );

        }


        /*
           Display answer
        */

        addMessage(
            "zoya",
            answer
        );


        /*
           Speak answer
        */

        speakZoya(
            answer
        );


    }
    catch(error) {


        console.error(
            "Zoya error:",
            error
        );


        removeThinking();


        addMessage(

            "zoya",

            "Umm... something went wrong on my side. 😭\n\n" +
            "Technical message: " +
            (
                error?.message ||
                "Unknown error."
            )

        );

    }
    finally {


        /*
           Enable everything again
        */

        zoyaInput.disabled =
            false;


        sendButton.disabled =
            false;


        micButton.disabled =
            false;


        zoyaInput.focus();

    }

}


/* =========================================================
   QUICK QUESTION
========================================================= */

function askQuick(
    question
) {

    zoyaInput.value =
        question;


    sendMessage();

}


/* =========================================================
   ENTER KEY
========================================================= */

zoyaInput.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);

</script>
