<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Zoya — PrvnNotes</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #07111f;
    color: #e8edf5;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================
   NAVIGATION
========================= */

.navbar {
    height: 64px;
    background: #07111f;
    border-bottom: 1px solid #1b2a3d;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 8%;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
}

.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
}

.nav-links a {
    color: #c7d0dc;
    text-decoration: none;
    font-size: 14px;
    transition: 0.2s;
}

.nav-links a:hover {
    color: white;
}

/* =========================
   MAIN
========================= */

.main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 70px 25px 100px;
}

.intro {
    text-align: center;
    margin-bottom: 40px;
}

.intro-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #8291a5;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.intro h1 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 400;
}

.intro p {
    color: #9eabbc;
    margin-top: 12px;
}

/* =========================
   ZOYA CHARACTER
========================= */

.zoya-stage {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

.zoya-character {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%, #ffffff 0%, #dce6f1 18%, #9aa9ba 19%, #1d2c40 60%, #101b2b 100%);

    border: 3px solid #34465d;

    position: relative;

    box-shadow:
        0 0 0 10px rgba(80, 110, 145, 0.06),
        0 20px 50px rgba(0,0,0,0.35);

    transition: 0.3s;
}

.zoya-character::before {
    content: "Z";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-family: Georgia, serif;
    font-size: 54px;
    font-weight: bold;

    color: #07111f;
}

.zoya-character.thinking {
    animation: thinkPulse 1.2s infinite;
}

@keyframes thinkPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }

    100% {
        transform: scale(1);
    }
}

.zoya-status {
    text-align: center;
    min-height: 25px;

    color: #8fa0b4;
    font-size: 13px;
}

/* =========================
   CHAT BOX
========================= */

.chat-wrapper {
    border: 1px solid #26364a;
    background: #0b1625;

    border-radius: 4px;

    overflow: hidden;

    box-shadow:
        0 20px 70px rgba(0,0,0,0.2);
}

.chat {
    height: 520px;
    overflow-y: auto;

    padding: 25px;
}

/* scrollbar */

.chat::-webkit-scrollbar {
    width: 8px;
}

.chat::-webkit-scrollbar-track {
    background: #091321;
}

.chat::-webkit-scrollbar-thumb {
    background: #33445a;
    border-radius: 10px;
}

/* =========================
   MESSAGE
========================= */

.message {
    display: flex;
    margin-bottom: 20px;
}

.message.zoya {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;

    padding: 16px;

    border: 1px solid #26364a;

    line-height: 1.6;

    font-size: 14px;
}

.message.zoya .bubble {
    background: #101d2d;
}

.message.user .bubble {
    background: #202d3f;
}

.label {
    font-size: 10px;
    letter-spacing: 1px;
    color: #718198;

    margin-bottom: 8px;

    text-transform: uppercase;
}

/* =========================
   THINKING
========================= */

.thinking-bubble {
    display: flex;
    align-items: center;
    gap: 6px;
}

.dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #9aa9ba;

    animation: thinkingDots 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.2s;
}

.dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes thinkingDots {

    0% {
        opacity: 0.25;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-4px);
    }

    100% {
        opacity: 0.25;
        transform: translateY(0);
    }
}

/* =========================
   QUICK QUESTIONS
========================= */

.quick-questions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;

    padding: 15px 25px 5px;
}

.quick-btn {
    background: transparent;

    color: #aab7c7;

    border: 1px solid #26364a;

    padding: 9px 12px;

    font-size: 12px;

    cursor: pointer;

    transition: 0.2s;
}

.quick-btn:hover {
    background: #182638;
    color: white;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: 8px;

    padding: 10px 25px;
}

.control-btn {
    background: transparent;

    color: #aeb9c8;

    border: 1px solid #26364a;

    padding: 8px 12px;

    cursor: pointer;

    font-size: 12px;
}

.control-btn:hover {
    background: #172537;
    color: white;
}

.control-btn.active {
    background: #24364d;
    color: white;
}

/* =========================
   VOICE SELECTOR
========================= */

.voice-area {
    display: flex;

    align-items: center;

    gap: 8px;

    padding: 0 25px 15px;
}

.voice-area label {
    font-size: 11px;
    color: #718198;
}

#voiceSelect {
    flex: 1;

    max-width: 500px;

    background: #101d2d;

    color: #cbd5e1;

    border: 1px solid #26364a;

    padding: 8px;
}

/* =========================
   INPUT
========================= */

.input-area {
    border-top: 1px solid #26364a;

    padding: 15px;

    display: flex;

    gap: 10px;
}

#zoyaInput {
    flex: 1;

    min-width: 0;

    resize: none;

    height: 50px;

    background: #111d2c;

    border: 1px solid #3a4a5e;

    color: white;

    padding: 14px;

    font-family: inherit;

    outline: none;
}

#zoyaInput:focus {
    border-color: #61758e;
}

#zoyaInput::placeholder {
    color: #66758a;
}

.send-btn {
    width: 55px;

    border: 1px solid #3a4a5e;

    background: #162335;

    color: white;

    cursor: pointer;

    font-size: 20px;
}

.send-btn:hover {
    background: #24364d;
}

.send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 100px;

    border-top: 1px solid #1b2a3d;

    padding-top: 30px;

    color: #65758b;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .navbar {
        padding: 0 20px;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a {
        font-size: 12px;
    }

    .main {
        padding: 50px 12px 70px;
    }

    .chat {
        height: 500px;
        padding: 15px;
    }

    .bubble {
        max-width: 88%;
    }

    .voice-area {
        flex-direction: column;
        align-items: stretch;
    }

    #voiceSelect {
        max-width: none;
    }

    .controls {
        justify-content: center;
        flex-wrap: wrap;
    }
}

</style>

<script>

/* =========================================================
   ZOYA CONFIGURATION
========================================================= */


/*
   IMPORTANT:

   We do NOT put the Gemini API key here.

   Zoya talks to your Vercel backend.
*/

const API_URL =
    "https://prvnnotes-github-io.vercel.app/api/chat";


/* =========================================================
   STATE
========================================================= */

let conversationHistory = [];

let isThinking = false;

let currentMode = "auto";

let voices = [];

let selectedVoice = null;

let recognition = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("zoyaInput");

const sendButton =
    document.getElementById("sendButton");

const character =
    document.getElementById("zoyaCharacter");

const statusText =
    document.getElementById("zoyaStatus");

const voiceSelect =
    document.getElementById("voiceSelect");


/* =========================================================
   VOICE SYSTEM
========================================================= */


/*
   Chrome loads voices asynchronously.

   So we check multiple times until voices appear.
*/

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();

    if (!voices.length) {

        voiceSelect.innerHTML =
            "<option>Loading voices...</option>";

        return;

    }


    voiceSelect.innerHTML = "";


    /*
       Sort voices.

       Indian English first.
    */

    const sorted =
        [...voices].sort((a, b) => {

            const aScore =
                getVoiceScore(a);

            const bScore =
                getVoiceScore(b);

            return bScore - aScore;

        });


    sorted.forEach((voice, index) => {

        const option =
            document.createElement("option");

        option.value =
            voices.indexOf(voice);

        option.textContent =
            `${voice.name} — ${voice.lang}`;

        voiceSelect.appendChild(option);

    });


    /*
       Automatically choose the best voice.
    */

    const bestVoice =
        sorted[0];

    selectedVoice =
        bestVoice;


    voiceSelect.value =
        voices.indexOf(bestVoice);


    voiceSelect.addEventListener(
        "change",
        function () {

            const index =
                parseInt(this.value);

            selectedVoice =
                voices[index];

        }
    );

}


function getVoiceScore(voice) {

    let score = 0;

    const name =
        voice.name.toLowerCase();

    const lang =
        voice.lang.toLowerCase();


    /*
       Indian English is our first priority.
    */

    if (lang === "en-in") {
        score += 100;
    }

    if (lang.startsWith("en-in")) {
        score += 80;
    }


    /*
       Common Indian female voice names.
    */

    const femaleIndianNames = [

        "heera",
        "neerja",
        "raveena",
        "aditi",
        "veena",
        "priya",
        "swara",
        "kavya",
        "lekha",
        "sangeeta",
        "google हिन्दी",
        "female"

    ];


    femaleIndianNames.forEach(keyword => {

        if (name.includes(keyword)) {

            score += 50;

        }

    });


    /*
       Avoid obvious male names where possible.
    */

    const maleNames = [

        "ravi",
        "hemant",
        "prabhat",
        "male",
        "david",
        "mark",
        "daniel"

    ];


    maleNames.forEach(keyword => {

        if (name.includes(keyword)) {

            score -= 30;

        }

    });


    /*
       Prefer local voices because
       they usually work more reliably.
    */

    if (voice.localService) {

        score += 5;

    }


    return score;

}


/*
   Chrome fires this event when voices become available.
*/

if ("speechSynthesis" in window) {

    window.speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();

}


/* =========================================================
   SET MODE
========================================================= */

function setMode(mode) {

    currentMode =
        mode;


    document
        .getElementById("typeModeBtn")
        .classList.remove("active");

    document
        .getElementById("talkModeBtn")
        .classList.remove("active");

    document
        .getElementById("autoModeBtn")
        .classList.remove("active");


    if (mode === "type") {

        document
            .getElementById("typeModeBtn")
            .classList.add("active");

        statusText.textContent =
            "Zoya will type her replies.";

    }


    if (mode === "talk") {

        document
            .getElementById("talkModeBtn")
            .classList.add("active");

        statusText.textContent =
            "Zoya will speak her replies.";

    }


    if (mode === "auto") {

        document
            .getElementById("autoModeBtn")
            .classList.add("active");

        statusText.textContent =
            "Zoya will choose how to reply.";

    }

}


/* =========================================================
   STOP ZOYA
========================================================= */

function stopZoya() {

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

    }


    character.classList.remove("thinking");

    statusText.textContent =
        "Zoya is listening...";

}


/* =========================================================
   TEST VOICE
========================================================= */

function testVoice() {

    stopZoya();


    const text =
        "Hi! I'm Zoya. This is how I sound. Nice to meet you!";


    speak(text);

}


/* =========================================================
   SPEAK
========================================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        alert(
            "Your browser does not support voice playback."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    /*
       Use selected voice.
    */

    if (selectedVoice) {

        utterance.voice =
            selectedVoice;

        utterance.lang =
            selectedVoice.lang;

    } else {

        utterance.lang =
            "en-IN";

    }


    /*
       Natural-ish speaking settings.
    */

    utterance.rate =
        0.94;

    utterance.pitch =
        1.05;

    utterance.volume =
        1;


    utterance.onstart =
        function () {

            statusText.textContent =
                "Zoya is talking...";

        };


    utterance.onend =
        function () {

            statusText.textContent =
                "Zoya is listening...";

        };


    utterance.onerror =
        function () {

            statusText.textContent =
                "Zoya is listening...";

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   THINKING INDICATOR
========================================================= */

function showThinking() {

    isThinking =
        true;


    character.classList.add(
        "thinking"
    );


    statusText.textContent =
        "Zoya is thinking...";


    const wrapper =
        document.createElement("div");

    wrapper.id =
        "thinkingMessage";

    wrapper.className =
        "message zoya";


    wrapper.innerHTML = `

        <div class="bubble">

            <div class="label">
                ZOYA
            </div>

            <div class="thinking-bubble">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;


    chat.appendChild(wrapper);

    scrollChat();

}


/* =========================================================
   REMOVE THINKING
========================================================= */

function removeThinking() {

    isThinking =
        false;


    character.classList.remove(
        "thinking"
    );


    const thinking =
        document.getElementById(
            "thinkingMessage"
        );


    if (thinking) {

        thinking.remove();

    }

}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message user";


    message.innerHTML = `

        <div class="bubble">

            <div class="label">
                YOU
            </div>

            <div>
                ${escapeHTML(text)}
            </div>

        </div>

    `;


    chat.appendChild(message);

    scrollChat();

}


/* =========================================================
   ADD ZOYA MESSAGE
========================================================= */

function addZoyaMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message zoya";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.innerHTML = `

        <div class="label">
            ZOYA
        </div>

        <div class="zoya-text"></div>

    `;


    message.appendChild(bubble);

    chat.appendChild(message);


    const textElement =
        bubble.querySelector(
            ".zoya-text"
        );


    /*
       Typing animation.
    */

    typeText(
        textElement,
        text
    );


    scrollChat();


    return message;

}


/* =========================================================
   TYPE TEXT
========================================================= */

function typeText(element, text) {

    let index = 0;


    /*
       Convert line breaks.
    */

    const safeText =
        escapeHTML(text)
            .replace(/\n/g, "<br>");


    /*
       If response is short,
       type relatively quickly.
    */

    const speed =
        text.length > 500
            ? 8
            : 18;


    function typeNext() {

        if (index >= text.length) {

            element.innerHTML =
                safeText;

            scrollChat();

            return;

        }


        /*
           Rebuild visible portion.
        */

        const current =
            text.substring(
                0,
                index + 1
            );


        element.innerHTML =
            escapeHTML(current)
                .replace(/\n/g, "<br>");


        index++;


        scrollChat();


        setTimeout(
            typeNext,
            speed
        );

    }


    typeNext();

}


/* =========================================================
   SCROLL CHAT
========================================================= */

function scrollChat() {

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const question =
        input.value.trim();


    if (!question) {

        return;

    }


    if (isThinking) {

        return;

    }


    addUserMessage(
        question
    );


    input.value =
        "";


    sendButton.disabled =
        true;


    showThinking();


    try {

        /*
           Send the message to your
           existing Vercel backend.
        */

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                question,

                            history:
                                conversationHistory

                        })

                }
            );


        /*
           Get raw text first.

           This makes errors much easier
           to understand than blindly calling
           response.json().
        */

        const raw =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(raw);

        } catch (jsonError) {

            throw new Error(
                "The server returned something other than JSON."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                `Server error ${response.status}`
            );

        }


        /*
           Your backend may return different
           property names depending on the
           current version.

           We safely check the common ones.
        */

        const reply =
            data.reply ||
            data.response ||
            data.message ||
            data.text ||
            data.answer;


        if (!reply) {

            throw new Error(
                "Zoya received an empty response from the server."
            );

        }


        /*
           Save conversation.
        */

        conversationHistory.push({

            role: "user",

            content: question

        });


        conversationHistory.push({

            role: "assistant",

            content: reply

        });


        removeThinking();


        /*
           Decide whether to type or talk.
        */

        let shouldSpeak =
            false;


        if (currentMode === "talk") {

            shouldSpeak =
                true;

        }


        if (currentMode === "type") {

            shouldSpeak =
                false;

        }


        /*
           AUTO MODE

           Short answers:
           speak them.

           Longer answers:
           type them.

           This avoids Zoya speaking
           for two minutes when she has
           a long answer.
        */

        if (currentMode === "auto") {

            shouldSpeak =
                reply.length <= 240;

        }


        /*
           Always show the response
           on screen.
        */

        addZoyaMessage(
            reply
        );


        /*
           Speak when appropriate.
        */

        if (shouldSpeak) {

            /*
               Small delay makes it feel
               more natural after thinking.
            */

            setTimeout(
                () => {

                    speak(reply);

                },
                250
            );

        } else {

            statusText.textContent =
                "Zoya is listening...";

        }

    }

    catch (error) {

        removeThinking();


        const errorMessage =
            "Umm... something went wrong on my side. 😭\n\n" +
            "Technical message: " +
            error.message;


        addZoyaMessage(
            errorMessage
        );


        statusText.textContent =
            "Zoya is listening...";


        console.error(
            "Zoya error:",
            error
        );

    }

    finally {

        sendButton.disabled =
            false;

        input.focus();

    }

}


/* =========================================================
   QUICK QUESTION
========================================================= */

function askQuestion(question) {

    input.value =
        question;

    sendMessage();

}


/* =========================================================
   ENTER KEY
========================================================= */

function handleInputKey(event) {

    /*
       Enter = send

       Shift + Enter = new line
    */

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   VOICE INPUT
========================================================= */

function startListening() {

    /*
       Chrome Speech Recognition.
    */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;

    }


    if (recognition) {

        recognition.stop();

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    statusText.textContent =
        "Zoya is listening to you...";


    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0].transcript;


            input.value =
                transcript;


            statusText.textContent =
                "Got it. Sending...";


            sendMessage();

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Voice input error:",
                event.error
            );


            statusText.textContent =
                "Zoya is listening...";

        };


    recognition.onend =
        function() {

            if (!isThinking) {

                statusText.textContent =
                    "Zoya is listening...";

            }

        };


    recognition.start();

}


/* =========================================================
   INITIAL SETUP
========================================================= */

setTimeout(
    loadVoices,
    500
);

setTimeout(
    loadVoices,
    1500
);

setTimeout(
    loadVoices,
    3000
);


/*
   Default mode = AUTO
*/

setMode("auto");


/*
   Focus input when page opens.
*/

setTimeout(
    () => input.focus(),
    500
);

</script>
