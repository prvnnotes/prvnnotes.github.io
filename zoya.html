<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Zoya — PrvnNotes</title>


<style>

/* =========================================================
   BASIC RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background: #07111f;

    color: #e8edf5;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    height: 64px;

    padding: 0 8%;

    background: #07111f;

    border-bottom:
        1px solid #1d2b3d;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 1px;

}


.nav-links {

    display: flex;

    gap: 26px;

    align-items: center;

}


.nav-links a {

    color: #aeb9c7;

    text-decoration: none;

    font-size: 13px;

    transition: .2s;

}


.nav-links a:hover {

    color: white;

}


/* =========================================================
   PAGE
========================================================= */

.page {

    min-height:
        calc(100vh - 64px);

    display: flex;

    justify-content: center;

    padding:
        45px 20px 70px;

}


/* =========================================================
   ZOYA WRAPPER
========================================================= */

.zoya-wrapper {

    width:
        min(720px, 100%);

}


/* =========================================================
   SMALL INTRO
========================================================= */

.zoya-intro {

    text-align: center;

    margin-bottom: 25px;

}


.zoya-intro h1 {

    margin:
        0 0 8px;

    font-family:
        Georgia,
        serif;

    font-size:
        38px;

    font-weight:
        400;

}


.zoya-intro p {

    margin: 0;

    color:
        #8492a5;

    font-size:
        13px;

}


/* =========================================================
   CHAT WINDOW
========================================================= */

.chat-window {

    background:
        #0b1625;

    border:
        1px solid #27374b;

    border-radius:
        14px;

    overflow:
        hidden;

    box-shadow:
        0 25px 80px rgba(0,0,0,.28);

}


/* =========================================================
   CHAT HEADER
========================================================= */

.chat-header {

    height:
        70px;

    padding:
        0 20px;

    background:
        #101c2c;

    border-bottom:
        1px solid #26364a;

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

}


/* =========================================================
   ZOYA AVATAR
========================================================= */

.avatar {

    width:
        43px;

    height:
        43px;

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #e8edf4,
            #a9b5c4
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #162234;

    font-family:
        Georgia,
        serif;

    font-weight:
        bold;

    font-size:
        21px;

    position:
        relative;

}


/* Online dot */

.avatar::after {

    content:
        "";

    position:
        absolute;

    width:
        10px;

    height:
        10px;

    border-radius:
        50%;

    background:
        #71a878;

    border:
        2px solid #101c2c;

    right:
        0;

    bottom:
        1px;

}


/* =========================================================
   HEADER TEXT
========================================================= */

.header-info {

    display:
        flex;

    flex-direction:
        column;

    gap:
        3px;

}


.header-name {

    font-size:
        15px;

    font-weight:
        600;

}


.header-status {

    font-size:
        11px;

    color:
        #75869b;

}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-area {

    height:
        500px;

    padding:
        24px 20px;

    overflow-y:
        auto;

    background:
        #091522;

}


/* scrollbar */

.chat-area::-webkit-scrollbar {

    width:
        7px;

}


.chat-area::-webkit-scrollbar-track {

    background:
        #091522;

}


.chat-area::-webkit-scrollbar-thumb {

    background:
        #304156;

    border-radius:
        10px;

}


/* =========================================================
   MESSAGE ROW
========================================================= */

.message {

    display:
        flex;

    margin-bottom:
        16px;

    animation:
        messageIn .25s ease;

}


.message.zoya {

    justify-content:
        flex-start;

}


.message.user {

    justify-content:
        flex-end;

}


@keyframes messageIn {

    from {

        opacity:
            0;

        transform:
            translateY(6px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   BUBBLE
========================================================= */

.bubble {

    max-width:
        75%;

    padding:
        11px 14px;

    border-radius:
        14px;

    font-size:
        14px;

    line-height:
        1.55;

    word-wrap:
        break-word;

}


/* Zoya */

.message.zoya .bubble {

    background:
        #172537;

    color:
        #e1e7ef;

    border-top-left-radius:
        4px;

}


/* User */

.message.user .bubble {

    background:
        #26374b;

    color:
        #f0f3f7;

    border-top-right-radius:
        4px;

}


/* =========================================================
   MESSAGE LABEL
========================================================= */

.message-label {

    font-size:
        9px;

    letter-spacing:
        .8px;

    color:
        #718197;

    margin-bottom:
        4px;

    text-transform:
        uppercase;

}


/* =========================================================
   THINKING BUBBLE
========================================================= */

.thinking-bubble {

    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    padding:
        13px 16px;

}


/* =========================================================
   THINKING DOTS
========================================================= */

.thinking-dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #8292a6;

    animation:
        thinking 1.25s infinite;

}


.thinking-dot:nth-child(2) {

    animation-delay:
        .18s;

}


.thinking-dot:nth-child(3) {

    animation-delay:
        .36s;

}


@keyframes thinking {

    0%,
    60%,
    100% {

        opacity:
            .25;

        transform:
            translateY(0);

    }

    30% {

        opacity:
            1;

        transform:
            translateY(-3px);

    }

}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {

    padding:
        12px 14px;

    background:
        #101c2c;

    border-top:
        1px solid #26364a;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

}


/* =========================================================
   INPUT
========================================================= */

#messageInput {

    flex:
        1;

    height:
        44px;

    resize:
        none;

    outline:
        none;

    border:
        1px solid #2d3e53;

    border-radius:
        22px;

    background:
        #0b1726;

    color:
        #edf2f7;

    padding:
        12px 17px;

    font-family:
        inherit;

    font-size:
        14px;

}


#messageInput::placeholder {

    color:
        #68788d;

}


#messageInput:focus {

    border-color:
        #4b5e75;

}


/* =========================================================
   SEND BUTTON
========================================================= */

.send-button {

    width:
        44px;

    height:
        44px;

    border:
        none;

    border-radius:
        50%;

    background:
        #26374b;

    color:
        #e7edf5;

    cursor:
        pointer;

    font-size:
        18px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    transition:
        .2s;

}


.send-button:hover {

    background:
        #344961;

}


.send-button:disabled {

    opacity:
        .4;

    cursor:
        not-allowed;

}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align:
        center;

    margin-top:
        35px;

    color:
        #607087;

    font-size:
        11px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {


    .navbar {

        padding:
            0 18px;

    }


    .nav-links {

        gap:
            12px;

    }


    .nav-links a {

        font-size:
            11px;

    }


    .page {

        padding:
            25px 10px 50px;

    }


    .zoya-intro {

        margin-bottom:
            18px;

    }


    .zoya-intro h1 {

        font-size:
            32px;

    }


    .chat-window {

        border-radius:
            12px;

    }


    .chat-area {

        height:
            520px;

        padding:
            18px 12px;

    }


    .bubble {

        max-width:
            85%;

        font-size:
            14px;

    }


    .input-area {

        padding:
            10px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav class="navbar">


    <div class="logo">
        PRAVEEN SHARMA
    </div>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="who-am-i.html">
            Who Am I?
        </a>

        <a href="explore.html">
            Explore
        </a>

        <a href="kaam-dhandha.html">
            Kaam-Dhandha
        </a>

        <a href="connect.html">
            Let's Connect
        </a>

        <a href="zoya.html">
            Zoya
        </a>

    </div>


</nav>



<!-- =========================================================
     PAGE
========================================================= -->

<main class="page">


    <div class="zoya-wrapper">


        <!-- INTRO -->

        <div class="zoya-intro">

            <h1>
                Zoya.
            </h1>

            <p>
                Just a little corner for a conversation.
            </p>

        </div>



        <!-- CHAT -->

        <div class="chat-window">


            <!-- CHAT HEADER -->

            <div class="chat-header">


                <div class="avatar">
                    Z
                </div>


                <div class="header-info">

                    <div class="header-name">
                        Zoya
                    </div>

                    <div
                        class="header-status"
                        id="headerStatus">

                        online

                    </div>

                </div>


            </div>



            <!-- CHAT MESSAGES -->

            <div
                class="chat-area"
                id="chatArea">


                <!-- ZOYA INTRODUCTION -->

                <div class="message zoya">

                    <div class="bubble">

                        <div class="message-label">
                            Zoya
                        </div>

                        <div>
                            Hi! I'm Zoya. 😊
                            <br><br>
                            I'm a little AI tucked into
                            Praveen's corner of the internet.
                            <br><br>
                            What's on your mind?
                        </div>

                    </div>

                </div>


            </div>



            <!-- INPUT -->

            <div class="input-area">


                <textarea
                    id="messageInput"
                    placeholder="Type a message..."
                    rows="1">
                </textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()">

                    ➤

                </button>


            </div>


        </div>



        <div class="footer">

            A little corner of the internet by Praveen Sharma · 2026

        </div>


    </div>


</main>



<script>

/* =========================================================
   ZOYA CHAT
========================================================= */


/*
   IMPORTANT:

   This connects to your existing Vercel API.

   No voice.
   No speech synthesis.
   No microphone.
   No additional API.
*/

const API_URL =
    "https://prvnnotes-github-io.vercel.app/api/chat";


/* =========================================================
   ELEMENTS
========================================================= */

const chatArea =
    document.getElementById(
        "chatArea"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const headerStatus =
    document.getElementById(
        "headerStatus"
    );


/* =========================================================
   CONVERSATION HISTORY
========================================================= */

let conversationHistory = [];

let isThinking = false;


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message user";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.innerHTML = `

        <div class="message-label">
            You
        </div>

        <div></div>

    `;


    bubble
        .querySelector("div:last-child")
        .textContent =
        text;


    message.appendChild(
        bubble
    );


    chatArea.appendChild(
        message
    );


    scrollChat();

}


/* =========================================================
   ADD ZOYA MESSAGE
========================================================= */

function addZoyaMessage(text) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message zoya";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "message-label";


    label.textContent =
        "Zoya";


    const content =
        document.createElement(
            "div"
        );


    bubble.appendChild(
        label
    );


    bubble.appendChild(
        content
    );


    message.appendChild(
        bubble
    );


    chatArea.appendChild(
        message
    );


    /*
       Give Zoya a small typing effect.
    */

    typeMessage(
        content,
        text
    );


    scrollChat();

}


/* =========================================================
   TYPING EFFECT
========================================================= */

function typeMessage(
    element,
    text
) {


    let index =
        0;


    const speed =
        text.length > 400
            ? 7
            : 16;


    function typeNext() {


        if (
            index >=
            text.length
        ) {

            element.textContent =
                text;

            scrollChat();

            return;

        }


        element.textContent =
            text.substring(
                0,
                index + 1
            );


        index++;


        scrollChat();


        setTimeout(
            typeNext,
            speed
        );

    }


    typeNext();

}


/* =========================================================
   THINKING
========================================================= */

function showThinking() {


    removeThinking();


    isThinking =
        true;


    headerStatus.textContent =
        "typing...";


    const message =
        document.createElement(
            "div"
        );


    message.id =
        "thinkingMessage";


    message.className =
        "message zoya";


    message.innerHTML = `

        <div class="bubble thinking-bubble">

            <span class="thinking-dot"></span>

            <span class="thinking-dot"></span>

            <span class="thinking-dot"></span>

        </div>

    `;


    chatArea.appendChild(
        message
    );


    scrollChat();

}


/* =========================================================
   REMOVE THINKING
========================================================= */

function removeThinking() {


    const thinking =
        document.getElementById(
            "thinkingMessage"
        );


    if (thinking) {

        thinking.remove();

    }


    isThinking =
        false;


    headerStatus.textContent =
        "online";

}


/* =========================================================
   SCROLL
========================================================= */

function scrollChat() {

    chatArea.scrollTop =
        chatArea.scrollHeight;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {


    const question =
        messageInput.value.trim();


    if (!question) {

        return;

    }


    if (isThinking) {

        return;

    }


    /*
       Show user's message.
    */

    addUserMessage(
        question
    );


    /*
       Clear input.
    */

    messageInput.value =
        "";


    /*
       Show thinking.
    */

    showThinking();


    /*
       Disable send.
    */

    sendButton.disabled =
        true;


    try {


        /*
           Add user to history.
        */

        conversationHistory.push({

            role:
                "user",

            content:
                question

        });


        /*
           Call existing API.
        */

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                question,

                            history:
                                conversationHistory

                        })

                }
            );


        /*
           Read response as text first.

           This prevents the ugly
           "Unexpected token <"
           error from crashing the page.
        */

        const raw =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(raw);

        }

        catch (jsonError) {

            throw new Error(
                "The server returned an invalid response."
            );

        }


        /*
           Check server error.
        */

        if (!response.ok) {

            throw new Error(

                data.error ||
                data.message ||
                `Server error ${response.status}`

            );

        }


        /*
           Support the response names
           your existing backend may use.
        */

        const answer =
            data.answer ||
            data.reply ||
            data.response ||
            data.message ||
            data.text;


        if (!answer) {

            throw new Error(
                "Zoya returned an empty response."
            );

        }


        /*
           Save Zoya's response.
        */

        conversationHistory.push({

            role:
                "assistant",

            content:
                answer

        });


        /*
           Keep the conversation from
           becoming unnecessarily huge.
        */

        if (
            conversationHistory.length >
            20
        ) {

            conversationHistory =
                conversationHistory.slice(
                    -20
                );

        }


        /*
           Remove thinking.
        */

        removeThinking();


        /*
           Show Zoya's response.
        */

        addZoyaMessage(
            answer
        );


    }

    catch (error) {


        console.error(
            "Zoya error:",
            error
        );


        removeThinking();


        /*
           Friendly error message.
        */

        addZoyaMessage(

            "Hmm... I think I lost my train of thought for a second. 😅\n\n" +
            "Give me a moment and try again."

        );

    }

    finally {


        sendButton.disabled =
            false;


        messageInput.focus();

    }

}


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(

    "keydown",

    function(event) {


        /*
           Enter sends.

           Shift + Enter creates
           a new line.
        */

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);


/* =========================================================
   INITIAL FOCUS
========================================================= */

setTimeout(

    function() {

        messageInput.focus();

    },

    400

);

</script>


</body>

</html>
